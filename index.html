    <!-- Script de Funcionalidad -->
    <script>
        let videoStream = null;
        let currentLat = 15.5378, currentLon = -87.7063, currentAlt = 0.0, currentAccuracy = 5.0;
        let currentHeadingDegrees = 0, currentCardinal = 'N';
        let currentAddress = 'Calculando ubicación...';
        let currentGMTOffset = '';
        let galleryItems = [], currentViewerIndex = null;
        let mediaRecorder = null, recordedChunks = [], isRecording = false;
        let recordingTimer = null, recordingSeconds = 0;
        let map = null, marker = null;
        let customLogoImage = null;

        lucide.createIcons();

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedSettings();
            initCamera();
            initGeolocation();
            initCompass();
            initMiniMap(currentLat, currentLon);
            calculateTimeZone();
            loadPersistentGallery(); // Cargar fotos guardadas permanentemente
            setInterval(updateClock, 1000);
            updateClock();
        });

        function loadPersistentGallery() {
            const saved = localStorage.getItem('gps_gallery_items');
            if (saved) {
                try {
                    galleryItems = JSON.parse(saved);
                    updateGalleryUI();
                } catch(e) {}
            }
        }

        function savePersistentGallery() {
            localStorage.setItem('gps_gallery_items', JSON.stringify(galleryItems));
        }

        function loadSavedSettings() {
            if (localStorage.getItem('gps_company')) {
                document.getElementById('input-company').value = localStorage.getItem('gps_company');
            }
            if (localStorage.getItem('gps_project')) {
                document.getElementById('input-project').value = localStorage.getItem('gps_project');
            }
            if (localStorage.getItem('gps_notes')) {
                document.getElementById('input-notes').value = localStorage.getItem('gps_notes');
            }
            if (localStorage.getItem('gps_logo')) {
                customLogoImage = new Image();
                customLogoImage.onload = function() {
                    document.getElementById('logo-container').innerHTML = `<img src="${localStorage.getItem('gps_logo')}" class="w-full h-full object-cover">`;
                };
                customLogoImage.src = localStorage.getItem('gps_logo');
            }

            const toggles = ['address', 'weather', 'map', 'coords', 'compass'];
            toggles.forEach(t => {
                const val = localStorage.getItem(`gps_toggle_${t}`);
                if (val !== null) {
                    const isChecked = val === 'true';
                    document.getElementById(`toggle-${t}`).checked = isChecked;
                }
            });

            updateSettings();
            toggleHudElements();
        }

        async function initCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });
                document.getElementById('camera-feed').srcObject = videoStream;
            } catch (err) {
                // Permiso denegado de cámara silencioso o controlado
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('hud-time').innerText = now.toLocaleTimeString();
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateLetterStr = now.toLocaleDateString('es-ES', options);
            document.getElementById('hud-date-text').innerText = dateLetterStr.charAt(0).toUpperCase() + dateLetterStr.slice(1);
        }

        function calculateTimeZone() {
            const offset = -new Date().getTimezoneOffset();
            const sign = offset >= 0 ? '+' : '-';
            const hours = Math.floor(Math.abs(offset) / 60).toString().padStart(2, '0');
            currentGMTOffset = `GMT${sign}${hours}:00`;
            document.getElementById('hud-timezone').innerText = currentGMTOffset;
        }

        function initMiniMap(lat, lon) {
            if (!map) {
                map = L.map('mini-map', {
                    zoomControl: false,
                    attributionControl: false,
                    dragging: false,
                    scrollWheelZoom: false
                }).setView([lat, lon], 17);

                L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                    maxZoom: 20,
                    subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                }).addTo(map);

                marker = L.circleMarker([lat, lon], {
                    radius: 8,
                    color: '#ffffff',
                    fillColor: '#3b82f6',
                    fillOpacity: 1,
                    weight: 3
                }).addTo(map);
            } else {
                map.setView([lat, lon], 17);
                marker.setLatLng([lat, lon]);
            }
        }

        function initGeolocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    currentAlt = pos.coords.altitude || 0.0;
                    currentAccuracy = pos.coords.accuracy || 5.0;

                    document.getElementById('hud-coords').innerText = `Lat: ${currentLat.toFixed(4)}, Lon: ${currentLon.toFixed(4)}`;
                    document.getElementById('hud-altitude').innerText = `Alt: ${Math.round(currentAlt)}m (±${Math.round(currentAccuracy)}m)`;

                    if (map && marker) {
                        map.setView([currentLat, currentLon], 17);
                        marker.setLatLng([currentLat, currentLon]);
                    }

                    fetchAddress(currentLat, currentLon);

                }, () => {}, { enableHighAccuracy: true });
            }
        }

        async function fetchAddress(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                const data = await response.json();
                if (data && data.address) {
                    const addr = data.address;
                    const subLocality = addr.suburb || addr.neighbourhood || addr.residential || addr.hamlet || '';
                    const locality = addr.city || addr.town || addr.village || addr.municipality || '';
                    
                    let parts = [];
                    if (subLocality) parts.push(subLocality);
                    if (locality && locality !== subLocality) parts.push(locality);

                    currentAddress = parts.length > 0 ? parts.join(', ') : (data.display_name.split(',')[0] || 'Ubicación actual');
                    document.getElementById('hud-address').innerText = currentAddress;
                }
            } catch (e) {
                currentAddress = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                document.getElementById('hud-address').innerText = currentAddress;
            }
        }

        function initCompass() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.alpha !== null) {
                        currentHeadingDegrees = Math.round(e.alpha);
                        const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                        currentCardinal = dirs[Math.round(currentHeadingDegrees / 45) % 8];

                        const rose = document.getElementById('compass-rose');
                        if (rose) rose.style.transform = `rotate(${-currentHeadingDegrees}deg)`;
                        document.getElementById('hud-heading-cardinal').innerText = `${currentCardinal} (${currentHeadingDegrees}°)`;
                    }
                });
            }
        }

        function loadCustomLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    localStorage.setItem('gps_logo', base64Data);
                    customLogoImage = new Image();
                    customLogoImage.onload = function() {
                        document.getElementById('logo-container').innerHTML = `<img src="${base64Data}" class="w-full h-full object-cover">`;
                    };
                    customLogoImage.src = base64Data;
                };
                reader.readAsDataURL(file);
            }
        }

        function toggleHudElements() {
            const toggles = ['address', 'weather', 'map', 'coords', 'compass'];
            toggles.forEach(t => {
                const isChecked = document.getElementById(`toggle-${t}`).checked;
                localStorage.setItem(`gps_toggle_${t}`, isChecked);
            });

            document.getElementById('box-address').style.display = document.getElementById('toggle-address').checked ? 'flex' : 'none';
            document.getElementById('box-weather').style.display = document.getElementById('toggle-weather').checked ? 'flex' : 'none';
            document.getElementById('box-map').style.display = document.getElementById('toggle-map').checked ? 'block' : 'none';
            document.getElementById('box-coords').style.display = document.getElementById('toggle-coords').checked ? 'flex' : 'none';
            document.getElementById('box-compass-widget').style.display = document.getElementById('toggle-compass').checked ? 'flex' : 'none';
        }

        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }

        function updateSettings() {
            const comp = document.getElementById('input-company').value;
            const proj = document.getElementById('input-project').value;
            const notes = document.getElementById('input-notes').value;

            localStorage.setItem('gps_company', comp);
            localStorage.setItem('gps_project', proj);
            localStorage.setItem('gps_notes', notes);

            document.getElementById('company-name-display').innerText = comp;
            document.getElementById('project-name-display').innerText = proj;
            document.getElementById('hud-notes').innerText = notes;
            if (!customLogoImage) {
                document.getElementById('logo-text').innerText = comp.substring(0, 2).toUpperCase();
            }
        }

        async function capturePhoto() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const margin = 40;
            const boxWidth = canvas.width - (margin * 2);
            const cornerRadius = 30;

            const showMap = document.getElementById('toggle-map').checked;
            if (showMap) {
                const mapSize = 280;
                const mapX = margin;
                const mapY = margin;

                try {
                    const tileZ = 17;
                    const xTile = Math.floor((currentLon + 180) / 360 * Math.pow(2, tileZ));
                    const yTile = Math.floor((1 - Math.log(Math.tan(currentLat * Math.PI / 180) + 1 / Math.cos(currentLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, tileZ));
                    const subdomains = ['mt0', 'mt1', 'mt2', 'mt3'];
                    const sub = subdomains[Math.abs(Math.sin(currentLat + currentLon)) * 4 | 0];
                    const tileUrl = `https://${sub}.google.com/vt/lyrs=s,h&x=${xTile}&y=${yTile}&z=${tileZ}`;

                    const mapImg = await new Promise((resolve) => {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(null);
                        img.src = tileUrl;
                    });

                    if (mapImg) {
                        ctx.save();
                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(mapX, mapY, mapSize, mapSize, 24);
                        } else {
                            ctx.rect(mapX, mapY, mapSize, mapSize);
                        }
                        ctx.clip();
                        ctx.drawImage(mapImg, mapX, mapY, mapSize, mapSize);

                        ctx.beginPath();
                        ctx.arc(mapX + mapSize / 2, mapY + mapSize / 2, 10, 0, 2 * Math.PI);
                        ctx.fillStyle = '#3b82f6';
                        ctx.fill();
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = '#ffffff';
                        ctx.stroke();
                        ctx.restore();

                        ctx.lineWidth = 3;
                        ctx.strokeStyle = '#3b82f6';
                        ctx.strokeRect(mapX, mapY, mapSize, mapSize);
                    }
                } catch(e) {}
            }

            const showCompass = document.getElementById('toggle-compass').checked;
            if (showCompass) {
                const compSize = 280;
                const compX = canvas.width - margin - compSize;
                const compY = margin;

                ctx.save();
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(compX, compY, compSize, compSize, 24);
                } else {
                    ctx.rect(compX, compY, compSize, compSize);
                }
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#f59e0b';
                ctx.stroke();
                ctx.clip();

                const cx = compX + compSize / 2;
                const cy = compY + compSize / 2 - 15;
                const radius = 80;

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#64748B';
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((currentHeadingDegrees * Math.PI) / 180);

                ctx.beginPath();
                ctx.moveTo(0, -65);
                ctx.lineTo(14, 0);
                ctx.lineTo(0, 35);
                ctx.fillStyle = '#EF4444';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, 65);
                ctx.lineTo(-14, 0);
                ctx.lineTo(0, 35);
                ctx.fillStyle = '#94A3B8';
                ctx.fill();
                ctx.restore();

                ctx.font = 'bold 26px sans-serif';
                ctx.fillStyle = '#EF4444';
                ctx.textAlign = 'center';
                ctx.fillText('N', cx, cy - radius + 22);
                ctx.fillStyle = '#94A3B8';
                ctx.fillText('S', cx, cy + radius - 8);
                ctx.fillText('E', cx + radius - 15, cy + 8);
                ctx.fillText('O', cx - radius + 16, cy + 8);

                ctx.font = 'bold 24px sans-serif';
                ctx.fillStyle = '#FBBF24';
                ctx.textAlign = 'center';
                ctx.fillText(`${currentCardinal} (${currentHeadingDegrees}°)`, cx, compY + compSize - 30);

                ctx.restore();
            }

            const bottomBoxHeight = 310;
            const bottomBoxY = canvas.height - bottomBoxHeight - margin;

            ctx.save();
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(margin, bottomBoxY, boxWidth, bottomBoxHeight, cornerRadius);
            } else {
                ctx.rect(margin, bottomBoxY, boxWidth, bottomBoxHeight);
            }
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(71, 85, 105, 0.8)';
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 32px sans-serif';
            ctx.fillText(document.getElementById('input-company').value, margin + 40, bottomBoxY + 50);

            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let dateLetterStr = now.toLocaleDateString('es-ES', options);
            dateLetterStr = dateLetterStr.charAt(0).toUpperCase() + dateLetterStr.slice(1);

            ctx.font = 'bold 28px monospace';
            ctx.fillStyle = '#60A5FA';
            ctx.textAlign = 'right';
            ctx.fillText(timeStr, margin + boxWidth - 40, bottomBoxY + 45);

            ctx.font = 'bold 20px monospace';
            ctx.fillStyle = '#CBD5E1';
            ctx.fillText(`${dateLetterStr} (${currentGMTOffset})`, margin + boxWidth - 40, bottomBoxY + 78);

            let currentY = 120;

            if (document.getElementById('toggle-address').checked) {
                ctx.textAlign = 'left';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillStyle = '#34D399';
                ctx.fillText(`📍 ${currentAddress}`, margin + 40, bottomBoxY + currentY);
            }
            if (document.getElementById('toggle-weather').checked) {
                ctx.textAlign = 'right';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillStyle = '#FBBF24';
                ctx.fillText(`28°C · Soleado`, margin + boxWidth - 40, bottomBoxY + currentY);
            }
            currentY += 50;

            if (document.getElementById('toggle-coords').checked) {
                ctx.textAlign = 'left';
                ctx.font = '22px monospace';
                ctx.fillStyle = '#F8FAFC';
                ctx.fillText(`GPS: ${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}  |  Alt: ${Math.round(currentAlt)}m (±${Math.round(currentAccuracy)}m)`, margin + 40, bottomBoxY + currentY);
                currentY += 45;
            }

            ctx.font = 'italic 20px sans-serif';
            ctx.fillStyle = '#CBD5E1';
            ctx.fillText(`Nota: ${document.getElementById('input-notes').value}`, margin + 40, bottomBoxY + bottomBoxHeight - 25);

            const logoSize = 130;
            const logoX = margin + boxWidth - logoSize - 40;
            const logoY = bottomBoxY + bottomBoxHeight - logoSize - 30;

            if (customLogoImage) {
                ctx.save();
                ctx.beginPath();
                if (ctx.roundRect) { ctx.roundRect(logoX, logoY, logoSize, logoSize, 22); }
                else { ctx.rect(logoX, logoY, logoSize, logoSize); }
                ctx.clip();
                ctx.drawImage(customLogoImage, logoX, logoY, logoSize, logoSize);
                ctx.restore();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#60A5FA';
                ctx.strokeRect(logoX, logoY, logoSize, logoSize);
            } else {
                ctx.save();
                ctx.beginPath();
                if (ctx.roundRect) { ctx.roundRect(logoX, logoY, logoSize, logoSize, 22); }
                else { ctx.rect(logoX, logoY, logoSize, logoSize); }
                ctx.fillStyle = '#2563EB';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#60A5FA';
                ctx.stroke();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 54px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const compText = document.getElementById('input-company').value.substring(0, 2).toUpperCase();
                ctx.fillText(compText, logoX + logoSize / 2, logoY + logoSize / 2);
                ctx.restore();
            }

            ctx.restore();

            // CONVERSIÓN A BASE64 PARA PERSISTENCIA TOTAL
            const reader = new FileReader();
            canvas.toBlob((blob) => {
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const base64data = reader.result;
                    galleryItems.unshift({
                        id: Date.now(),
                        type: 'image',
                        url: base64data,
                        date: new Date().toLocaleString()
                    });
                    savePersistentGallery(); // Guardar permanente en localStorage
                    updateGalleryUI();
                    mostrarToast(); // Activamos el aviso flotante sutil
                };
            }, 'image/jpeg', 0.95);
        }

        function toggleVideoRecording() {
            if (!isRecording) {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(videoStream, { mimeType: 'video/webm;codecs=vp9' });
                } catch(e) {
                    mediaRecorder = new MediaRecorder(videoStream);
                }
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = function() {
                        galleryItems.unshift({
                            id: Date.now(),
                            type: 'video',
                            url: reader.result,
                            date: new Date().toLocaleString()
                        });
                        savePersistentGallery();
                        updateGalleryUI();
                        mostrarToast();
                    };
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recording-badge').classList.remove('hidden');
                document.getElementById('btn-record').className = "p-4 rounded-2xl bg-red-600 text-white transition flex flex-col items-center animate-pulse border border-red-500";

                recordingSeconds = 0;
                recordingTimer = setInterval(() => {
                    recordingSeconds++;
                    let m = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
                    let s = (recordingSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('recording-time').innerText = `${m}:${s}`;
                }, 1000);
            } else {
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(recordingTimer);
                document.getElementById('recording-badge').classList.add('hidden');
                document.getElementById('btn-record').className = "p-4 rounded-2xl bg-slate-800 text-slate-200 transition flex flex-col items-center border border-slate-700";
            }
        }

        function openGalleryModal() {
            document.getElementById('gallery-modal').classList.toggle('hidden');
            updateGalleryUI();
        }

        function updateGalleryUI() {
            const grid = document.getElementById('gallery-grid');
            document.getElementById('gallery-count').innerText = galleryItems.length;
            const badge = document.getElementById('gallery-badge');
            if (galleryItems.length > 0) {
                badge.innerText = galleryItems.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            grid.innerHTML = '';
            galleryItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "relative aspect-square bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 cursor-pointer hover:opacity-95 transition";
                div.onclick = () => openViewer(idx);
                div.innerHTML = item.type === 'image' 
                    ? `<img src="${item.url}" class="w-full h-full object-cover">` 
                    : `<video src="${item.url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i data-lucide="play-circle" class="w-12 h-12 text-white"></i></div>`;
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function openViewer(idx) {
            currentViewerIndex = idx;
            const item = galleryItems[idx];
            const container = document.getElementById('viewer-container');
            document.getElementById('viewer-date').innerText = item.date;
            container.innerHTML = item.type === 'image' 
                ? `<img src="${item.url}" class="max-h-full max-w-full object-contain rounded-xl">` 
                : `<video src="${item.url}" controls autoplay class="max-h-full max-w-full object-contain rounded-xl"></video>`;
            document.getElementById('viewer-modal').classList.remove('hidden');
        }

        function closeViewer() { document.getElementById('viewer-modal').classList.add('hidden'); currentViewerIndex = null; }

        function downloadCurrentMedia() {
            const item = galleryItems[currentViewerIndex];
            const a = document.createElement('a');
            a.href = item.url;
            a.download = `Captura_GPS_${item.id}.${item.type === 'image' ? 'jpg' : 'webm'}`;
            a.click();
            mostrarToast();
        }

        function deleteCurrentMedia() {
            galleryItems.splice(currentViewerIndex, 1);
            savePersistentGallery(); // Actualizar memoria permanente
            closeViewer();
            updateGalleryUI();
        }

        function mostrarToast() {
            var toast = document.getElementById("toast-notification");
            toast.className = "show";
            setTimeout(function() {
                toast.className = toast.className.replace("show", "");
            }, 3000);
        }
    </script>
