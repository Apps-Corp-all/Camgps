<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Corporativa GPS con Minimapa y Dirección</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS (Para el minimapa interactivo en tiempo real) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .compass-rose {
            transition: transform 0.15s ease-out;
        }
        /* Eliminar controles por defecto del minimapa para que sea limpio */
        .leaflet-control-container { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans select-none overflow-x-hidden">

    <!-- Header -->
    <header class="w-full bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <span class="w-4 h-4 rounded-full bg-red-500 animate-pulse" id="status-dot"></span>
            <span class="text-base font-bold tracking-wide text-slate-200" id="status-text">Buscando GPS y Dirección...</span>
        </div>
        <button onclick="toggleSettings()" class="p-3 rounded-full bg-slate-800 hover:bg-slate-700 transition text-slate-200">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
    </header>

    <!-- Visor de Cámara con HUD Superpuesto -->
    <main class="relative flex-1 flex flex-col items-center justify-center bg-black overflow-hidden">
        <video id="camera-feed" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
        <canvas id="snapshot-canvas" class="hidden"></canvas>

        <!-- Tarjeta de Datos y Marca de Agua Ampliada (Con Minimapa, Dirección y Zona Horaria) -->
        <div class="absolute inset-x-4 bottom-4 bg-slate-900/92 backdrop-blur-md border border-slate-700/80 rounded-3xl p-4 shadow-2xl flex flex-col space-y-3 pointer-events-none z-10">
            
            <!-- Fila Superior: Logo, Empresa y Hora/Fecha/Zona Horaria -->
            <div class="flex justify-between items-center border-b border-slate-700/60 pb-2.5">
                <div class="flex items-center space-x-3">
                    <div class="w-11 h-11 bg-blue-600 rounded-2xl flex items-center justify-center font-black text-white text-lg shadow-lg" id="logo-container">
                        EM
                    </div>
                    <div>
                        <h2 class="text-lg font-extrabold text-white uppercase tracking-wide" id="company-name-display">EMPRESA S.A.</h2>
                        <p class="text-xs font-semibold text-slate-400" id="project-name-display">Inspección de Campo</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xl font-mono font-black text-blue-400 block" id="hud-time">--:--:--</span>
                    <span class="text-xs font-mono font-bold text-slate-300 block"><span id="hud-date">--/--/----</span> <span id="hud-timezone" class="text-amber-400 font-semibold">GMT</span></span>
                </div>
            </div>

            <!-- Fila Media: Dirección / Nombre del Sitio Geográfico -->
            <div class="flex items-center space-x-2 text-xs font-medium text-slate-200 bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700/60">
                <i data-lucide="navigation" class="w-4 h-4 text-emerald-400 shrink-0"></i>
                <span id="hud-address" class="truncate">Obteniendo dirección y ubicación exacta...</span>
            </div>

            <!-- Fila Inferior: Minimapa, Coordenadas y Rosa Náutica -->
            <div class="grid grid-cols-12 gap-3 items-center">
                
                <!-- Minimapa Circular de Geolocalización -->
                <div class="col-span-3 relative aspect-square rounded-2xl overflow-hidden border-2 border-slate-700 shadow-inner bg-slate-950">
                    <div id="mini-map" class="w-full h-full"></div>
                    <div class="absolute inset-0 pointer-events-none border-2 border-blue-500/40 rounded-2xl z-10"></div>
                </div>

                <!-- Coordenadas y Rosa Náutica -->
                <div class="col-span-9 flex justify-between items-center">
                    <div class="flex flex-col space-y-1">
                        <div class="flex items-center space-x-1.5 text-slate-100 font-bold font-mono text-sm">
                            <i data-lucide="map-pin" class="w-4 h-4 text-red-500 shrink-0"></i>
                            <span id="hud-coords">Lat: 0.0000, Lon: 0.0000</span>
                        </div>
                        <div class="text-xs font-medium text-slate-400 italic flex items-center space-x-1">
                            <i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-500"></i>
                            <span id="hud-notes" class="truncate max-w-[170px]">Revisión técnica</span>
                        </div>
                    </div>

                    <!-- Rosa Náutica Dinámica -->
                    <div class="flex items-center space-x-2 bg-slate-800/90 px-3 py-1.5 rounded-2xl border border-slate-700">
                        <div class="relative w-10 h-10 flex items-center justify-center">
                            <svg id="compass-rose" class="compass-rose w-10 h-10" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="46" fill="none" stroke="#64748B" stroke-width="3" />
                                <text x="50" y="18" fill="#EF4444" font-size="16" font-weight="bold" text-anchor="middle">N</text>
                                <text x="50" y="92" fill="#94A3B8" font-size="14" font-weight="bold" text-anchor="middle">S</text>
                                <text x="88" y="55" fill="#94A3B8" font-size="14" font-weight="bold" text-anchor="middle">E</text>
                                <text x="12" y="55" fill="#94A3B8" font-size="14" font-weight="bold" text-anchor="middle">O</text>
                                <polygon points="50,22 56,50 50,45" fill="#EF4444" />
                                <polygon points="50,22 44,50 50,45" fill="#B91C1C" />
                                <polygon points="50,78 56,50 50,55" fill="#94A3B8" />
                                <polygon points="50,78 44,50 50,55" fill="#64748B" />
                            </svg>
                        </div>
                        <div class="text-right">
                            <span id="hud-heading-cardinal" class="text-sm font-black text-amber-400 block">N</span>
                            <span id="hud-heading-degrees" class="text-[10px] font-bold text-slate-300 block">0°</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Indicador de Grabación Activa -->
        <div id="recording-badge" class="absolute top-4 right-4 bg-red-600 text-white px-4 py-2 rounded-full text-sm font-bold uppercase tracking-wider flex items-center space-x-2 hidden animate-pulse shadow-2xl z-20">
            <span class="w-3 h-3 bg-white rounded-full"></span>
            <span id="recording-time">00:00</span>
        </div>
    </main>

    <!-- Controles Inferiores -->
    <footer class="w-full bg-slate-900 border-t border-slate-800 p-6 flex justify-around items-center z-20">
        <button onclick="openGalleryModal()" class="relative p-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex flex-col items-center">
            <i data-lucide="folder-open" class="w-7 h-7 text-blue-400"></i>
            <span class="text-xs font-bold mt-1 text-slate-300">Galería</span>
            <span id="gallery-badge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
        </button>

        <button onclick="capturePhoto()" class="w-20 h-20 rounded-full bg-white border-4 border-slate-400 hover:scale-105 active:scale-95 transition flex items-center justify-center shadow-xl">
            <div class="w-16 h-16 rounded-full bg-white border-4 border-slate-900"></div>
        </button>

        <button id="btn-record" onclick="toggleVideoRecording()" class="p-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex flex-col items-center">
            <i data-lucide="video" class="w-7 h-7 text-red-400" id="video-icon"></i>
            <span class="text-xs font-bold mt-1 text-slate-300">Grabar</span>
        </button>
    </footer>

    <!-- Modal de Configuración -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                <h3 class="font-bold text-lg text-white">Configuración de Marca</h3>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="text-slate-300 block mb-1 font-bold">Nombre de la Empresa</label>
                    <input type="text" id="input-company" value="EMPRESA S.A." oninput="updateSettings()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base">
                </div>
                <div>
                    <label class="text-slate-300 block mb-1 font-bold">Proyecto / Obra</label>
                    <input type="text" id="input-project" value="Inspección de Campo" oninput="updateSettings()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base">
                </div>
                <div>
                    <label class="text-slate-300 block mb-1 font-bold">Notas del Inspector</label>
                    <input type="text" id="input-notes" value="Revisión técnica de infraestructura" oninput="updateSettings()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base">
                </div>
            </div>
            <button onclick="toggleSettings()" class="w-full py-3 rounded-xl bg-blue-600 font-bold text-white text-base shadow-lg">Guardar y Cerrar</button>
        </div>
    </div>

    <!-- Modal de Galería -->
    <div id="gallery-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col hidden">
        <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
            <h2 class="font-bold text-lg text-white">Galería de Capturas (<span id="gallery-count">0</span>)</h2>
            <button onclick="openGalleryModal()" class="p-2 rounded-full bg-slate-800 text-slate-300"><i data-lucide="x" class="w-6 h-6"></i></button>
        </header>
        <div class="flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 gap-4 content-start" id="gallery-grid"></div>
    </div>

    <!-- Visor de Elemento Individual -->
    <div id="viewer-modal" class="fixed inset-0 bg-black/95 z-60 flex flex-col justify-between p-4 hidden">
        <div class="flex justify-between items-center">
            <span id="viewer-date" class="text-sm font-mono text-slate-300"></span>
            <button onclick="closeViewer()" class="p-2 rounded-full bg-slate-800 text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="flex-1 flex items-center justify-center relative my-2" id="viewer-container"></div>
        <div class="flex justify-around items-center p-3 bg-slate-900 rounded-2xl border border-slate-800">
            <button onclick="downloadCurrentMedia()" class="px-5 py-3 bg-blue-600 rounded-xl text-sm font-bold text-white flex items-center space-x-2">
                <i data-lucide="download" class="w-5 h-5"></i>
                <span>Guardar en Teléfono</span>
            </button>
            <button onclick="deleteCurrentMedia()" class="px-5 py-3 bg-red-600 rounded-xl text-sm font-bold text-white flex items-center space-x-2">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
                <span>Eliminar</span>
            </button>
        </div>
    </div>

    <!-- Script de Funcionalidad y Mapas -->
    <script>
        let videoStream = null;
        let currentLat = 0.0, currentLon = 0.0, currentHeadingDegrees = 0, currentCardinal = 'N';
        let currentAddress = 'Calculando ubicación...';
        let currentGMTOffset = '';
        let galleryItems = [], currentViewerIndex = null;
        let mediaRecorder = null, recordedChunks = [], isRecording = false;
        let recordingTimer = null, recordingSeconds = 0;
        let map = null, marker = null;

        lucide.createIcons();

        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            initGeolocation();
            initCompass();
            initMiniMap(19.4326, -99.1332); // Coordenadas iniciales por defecto (CDMX)
            calculateTimeZone();
            setInterval(updateClock, 1000);
            updateClock();
        });

        async function initCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });
                document.getElementById('camera-feed').srcObject = videoStream;
            } catch (err) {
                alert("Permiso de cámara o micrófono no concedido.");
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('hud-time').innerText = now.toLocaleTimeString();
            document.getElementById('hud-date').innerText = now.toLocaleDateString();
        }

        function calculateTimeZone() {
            const offset = -new Date().getTimezoneOffset();
            const sign = offset >= 0 ? '+' : '-';
            const hours = Math.floor(Math.abs(offset) / 60).toString().padStart(2, '0');
            const minutes = (Math.abs(offset) % 60).toString().padStart(2, '0');
            currentGMTOffset = `GMT${sign}${hours}:${minutes}`;
            document.getElementById('hud-timezone').innerText = currentGMTOffset;
        }

        function initMiniMap(lat, lon) {
            if (!map) {
                map = L.map('mini-map', {
                    zoomControl: false,
                    attributionControl: false,
                    dragging: false,
                    scrollWheelZoom: false
                }).setView([lat, lon], 15);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                }).addTo(map);

                marker = L.circleMarker([lat, lon], {
                    radius: 7,
                    color: '#3b82f6',
                    fillColor: '#60a5fa',
                    fillOpacity: 1,
                    weight: 2
                }).addTo(map);
            } else {
                map.setView([lat, lon], 15);
                marker.setLatLng([lat, lon]);
            }
        }

        function initGeolocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    document.getElementById('hud-coords').innerText = `Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)}`;
                    document.getElementById('status-dot').className = "w-4 h-4 rounded-full bg-emerald-500";
                    document.getElementById('status-text').innerText = "GPS Activo";

                    // Actualizar mapa
                    if (map && marker) {
                        map.setView([currentLat, currentLon], 15);
                        marker.setLatLng([currentLat, currentLon]);
                    }

                    // Obtener nombre del sitio / dirección real mediante Geocodificación inversa (Nominatim API)
                    fetchAddress(currentLat, currentLon);

                }, () => {
                    document.getElementById('status-dot').className = "w-4 h-4 rounded-full bg-amber-500";
                    document.getElementById('status-text').innerText = "Sin GPS preciso";
                }, { enableHighAccuracy: true });
            }
        }

        async function fetchAddress(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                const data = await response.json();
                if (data && data.display_name) {
                    // Tomar un formato corto pero descriptivo del lugar
                    const parts = data.display_name.split(',');
                    currentAddress = `${parts[0]}, ${parts[1] || ''} ${parts[2] || ''}`.trim();
                    document.getElementById('hud-address').innerText = currentAddress;
                }
            } catch (e) {
                currentAddress = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                document.getElementById('hud-address').innerText = currentAddress;
            }
        }

        function initCompass() {
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (e) => {
                    if (e.alpha !== null) {
                        currentHeadingDegrees = Math.round(e.alpha);
                        const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                        currentCardinal = dirs[Math.round(currentHeadingDegrees / 45) % 8];

                        const rose = document.getElementById('compass-rose');
                        rose.style.transform = `rotate(${-currentHeadingDegrees}deg)`;
                        document.getElementById('hud-heading-cardinal').innerText = currentCardinal;
                        document.getElementById('hud-heading-degrees').innerText = `${currentHeadingDegrees}°`;
                    }
                });
            }
        }

        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }

        function updateSettings() {
            const comp = document.getElementById('input-company').value;
            document.getElementById('company-name-display').innerText = comp;
            document.getElementById('project-name-display').innerText = document.getElementById('input-project').value;
            document.getElementById('hud-notes').innerText = document.getElementById('input-notes').value;
            document.getElementById('logo-container').innerText = comp.substring(0, 2).toUpperCase();
        }

        function capturePhoto() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('snapshot-canvas');
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Estampar Marca de Agua en la Imagen (Incluyendo Dirección y Zona Horaria)
            const margin = 50;
            const boxHeight = 270;
            const boxWidth = canvas.width - (margin * 2);
            const boxX = margin;
            const boxY = canvas.height - boxHeight - margin;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.93)';
            ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

            // Encabezado marca
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText(document.getElementById('input-company').value, boxX + 40, boxY + 60);

            ctx.font = 'bold 26px monospace';
            ctx.fillStyle = '#60A5FA';
            ctx.textAlign = 'right';
            ctx.fillText(`${document.getElementById('hud-time').innerText} (${currentGMTOffset})`, boxX + boxWidth - 40, boxY + 60);

            // Dirección / Sitio
            ctx.textAlign = 'left';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillStyle = '#34D399';
            ctx.fillText(`📍 ${currentAddress}`, boxX + 40, boxY + 115);

            // Coordenadas y Rumbo
            ctx.font = '24px monospace';
            ctx.fillStyle = '#F8FAFC';
            ctx.fillText(`GPS: Lat ${currentLat.toFixed(5)}, Lon ${currentLon.toFixed(5)}`, boxX + 40, boxY + 170);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#FBBF24';
            ctx.fillText(`Rumbo: ${currentCardinal} (${currentHeadingDegrees}°)`, boxX + boxWidth - 40, boxY + 170);

            // Notas
            ctx.textAlign = 'left';
            ctx.font = 'italic 22px sans-serif';
            ctx.fillStyle = '#94A3B8';
            ctx.fillText(`Notas: ${document.getElementById('input-notes').value}`, boxX + 40, boxY + 225);

            canvas.toBlob((blob) => {
                galleryItems.unshift({
                    id: Date.now(),
                    type: 'image',
                    url: URL.createObjectURL(blob),
                    date: new Date().toLocaleString()
                });
                updateGalleryUI();
                alert("¡Foto guardada con éxito en la galería!");
            }, 'image/jpeg', 0.95);
        }

        function toggleVideoRecording() {
            if (!isRecording) {
                recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(videoStream, { mimeType: 'video/webm;codecs=vp9' });
                } catch(e) {
                    mediaRecorder = new MediaRecorder(videoStream);
                }
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    galleryItems.unshift({
                        id: Date.now(),
                        type: 'video',
                        url: URL.createObjectURL(blob),
                        date: new Date().toLocaleString()
                    });
                    updateGalleryUI();
                    alert("¡Video grabado y guardado en la galería!");
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recording-badge').classList.remove('hidden');
                document.getElementById('btn-record').className = "p-4 rounded-2xl bg-red-600 text-white transition flex flex-col items-center animate-pulse";

                recordingSeconds = 0;
                recordingTimer = setInterval(() => {
                    recordingSeconds++;
                    let m = Math.floor(recordingSeconds / 60).toString().padStart(2, '0');
                    let s = (recordingSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('recording-time').innerText = `${m}:${s}`;
                }, 1000);
            } else {
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(recordingTimer);
                document.getElementById('recording-badge').classList.add('hidden');
                document.getElementById('btn-record').className = "p-4 rounded-2xl bg-slate-800 text-slate-200 transition flex flex-col items-center";
            }
        }

        function openGalleryModal() {
            document.getElementById('gallery-modal').classList.toggle('hidden');
            updateGalleryUI();
        }

        function updateGalleryUI() {
            const grid = document.getElementById('gallery-grid');
            document.getElementById('gallery-count').innerText = galleryItems.length;
            const badge = document.getElementById('gallery-badge');
            if (galleryItems.length > 0) {
                badge.innerText = galleryItems.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            grid.innerHTML = '';
            galleryItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "relative aspect-square bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 cursor-pointer hover:opacity-90 transition";
                div.onclick = () => openViewer(idx);
                div.innerHTML = item.type === 'image' 
                    ? `<img src="${item.url}" class="w-full h-full object-cover">` 
                    : `<video src="${item.url}" class="w-full h-full object-cover"></video><div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i data-lucide="play-circle" class="w-12 h-12 text-white"></i></div>`;
                grid.appendChild(div);
            });
            lucide.createIcons();
        }

        function openViewer(idx) {
            currentViewerIndex = idx;
            const item = galleryItems[idx];
            const container = document.getElementById('viewer-container');
            document.getElementById('viewer-date').innerText = item.date;
            container.innerHTML = item.type === 'image' 
                ? `<img src="${item.url}" class="max-h-full max-w-full object-contain rounded-xl">` 
                : `<video src="${item.url}" controls autoplay class="max-h-full max-w-full object-contain rounded-xl"></video>`;
            document.getElementById('viewer-modal').classList.remove('hidden');
        }

        function closeViewer() { document.getElementById('viewer-modal').classList.add('hidden'); currentViewerIndex = null; }

        function downloadCurrentMedia() {
            const item = galleryItems[currentViewerIndex];
            const a = document.createElement('a');
            a.href = item.url;
            a.download = `Captura_GPS_${item.id}.${item.type === 'image' ? 'jpg' : 'webm'}`;
            a.click();
        }

        function deleteCurrentMedia() {
            galleryItems.splice(currentViewerIndex, 1);
            closeViewer();
            updateGalleryUI();
        }
    </script>
</body>
</html>
