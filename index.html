<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Corporativa GPS Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .compass-rose { transition: transform 0.15s ease-out; }
        .leaflet-control-container { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans select-none overflow-x-hidden">

    <!-- Header Superior -->
    <header class="w-full bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 flex justify-between items-center z-20 shadow-lg">
        <div class="flex items-center space-x-3">
            <span class="w-4 h-4 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_#10b981]"></span>
            <span class="text-base font-extrabold tracking-wide text-slate-100" id="status-text">GPS Satelital Conectado</span>
        </div>
        <button onclick="toggleSettings()" class="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 transition text-slate-200 border border-slate-700">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
    </header>

    <!-- Visor de Cámara en Pantalla Completa -->
    <main class="relative flex-1 flex flex-col items-center justify-center bg-black overflow-hidden">
        <video id="camera-feed" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
        <canvas id="snapshot-canvas" class="hidden"></canvas>

        <!-- PANEL HUD EN PANTALLA (Con Fecha, Hora, Dirección, Clima, GPS y Brújula) -->
        <div class="absolute inset-x-2.5 bottom-2.5 bg-slate-900/80 backdrop-blur-xl border-2 border-slate-700/80 rounded-3xl p-4 shadow-[0_15px_40px_rgba(0,0,0,0.85)] flex flex-col space-y-3 pointer-events-none z-10">
            
            <!-- SECCIÓN 1: Empresa + Fecha, Hora y GMT -->
            <div class="flex justify-between items-center bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/80 shadow-inner">
                <div class="flex items-center space-x-3.5">
                    <div class="w-14 h-14 bg-blue-600/90 rounded-2xl flex items-center justify-center font-black text-white text-2xl shadow-lg border border-blue-400/80" id="logo-container">
                        EM
                    </div>
                    <div>
                        <h2 class="text-lg font-black text-white uppercase tracking-wider leading-tight" id="company-name-display">EMPRESA S.A.</h2>
                        <p class="text-sm font-bold text-blue-400 mt-0.5" id="project-name-display">Inspección de Campo</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xl font-mono font-black text-amber-400 block leading-tight" id="hud-time">--:--:--</span>
                    <span class="text-xs font-mono font-bold text-slate-200 block mt-1"><span id="hud-date">--/--/----</span> <span id="hud-timezone" class="text-blue-400 font-black">GMT-6</span></span>
                </div>
            </div>

            <!-- SECCIÓN 2: Dirección y Clima -->
            <div class="grid grid-cols-12 gap-2.5 text-sm">
                <div id="box-address" class="col-span-8 flex items-center space-x-2.5 bg-slate-800/80 px-3.5 py-2.5 rounded-2xl border border-slate-700/80 truncate shadow">
                    <i data-lucide="map-pin" class="w-5 h-5 text-emerald-400 shrink-0"></i>
                    <span id="hud-address" class="truncate font-extrabold text-slate-100 text-sm">Obteniendo ubicación y dirección...</span>
                </div>
                <div id="box-weather" class="col-span-4 flex items-center justify-center space-x-2 bg-slate-800/80 px-3.5 py-2.5 rounded-2xl border border-slate-700/80 font-extrabold text-amber-300 shadow text-sm">
                    <i data-lucide="cloud-sun" class="w-5 h-5 text-amber-400 shrink-0"></i>
                    <span id="hud-weather">28°C · Soleado</span>
                </div>
            </div>

            <!-- SECCIÓN 3: Minimapa + Coordenadas y Brújula -->
            <div class="grid grid-cols-12 gap-3 items-center">
                
                <!-- Minimapa Satelital Grande -->
                <div id="box-map" class="col-span-5 relative aspect-square rounded-2xl overflow-hidden border-2 border-blue-500/80 shadow-2xl bg-slate-950">
                    <div id="mini-map" class="w-full h-full"></div>
                </div>

                <!-- Bloque Derecho: Coordenadas, Brújula y Notas -->
                <div class="col-span-7
